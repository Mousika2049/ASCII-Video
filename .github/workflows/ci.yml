name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AsciiFlow.slnx
      - run: dotnet build AsciiFlow.slnx -c Release --no-restore
      - run: dotnet test AsciiFlow.slnx -c Release --no-build --no-restore
